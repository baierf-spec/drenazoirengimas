name: Quality checks
on:
  push:
    branches: [main, monorepo]
  pull_request:
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: [drenazoirengimas]
    defaults:
      run:
        working-directory: sites/${{ matrix.site }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
        working-directory: .
      - run: npm run check
      - run: npm run check:secrets
      - run: npm run deploy:dry-run
